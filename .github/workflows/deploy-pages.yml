# Compile le site en version statique et le publie sur GitHub Pages
# à chaque push sur main. Prérequis (une seule fois) :
# Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contrôles (lint, types, tests)
        run: npm run lint && npm run typecheck && npm test
      - name: Build statique
        run: npm run build:pages
        env:
          # Version publique : ni repères ◆ ni emplacements « À compléter »
          NEXT_PUBLIC_SHOW_PLACEHOLDERS: "false"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
